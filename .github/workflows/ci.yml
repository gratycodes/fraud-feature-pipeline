name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      # Unit tests use fakeredis and the in-process event source; Redis/Kafka tests skip.
      - run: pytest -q

  integration:
    # Real Redis and a real Kafka broker as service containers.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        # No KAFKA_* env: any of them replaces the image's working single-node default config.
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BOOTSTRAP: localhost:9092
      FFP_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Redis + Kafka tests (fail instead of skip)
        run: pytest -q -m integration -rs
      - name: Full demo on real Redis; fail if the in-sync replay shows skew
        run: ffp demo --redis-url "$REDIS_URL" --workdir /tmp/ffp --reports /tmp/reports --fail-on-skew
      - name: API latency benchmark
        run: python scripts/bench_api.py --redis-url "$REDIS_URL" --workdir /tmp/ffp --n 3000 --out /tmp/reports/latency.json
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: /tmp/reports

  compose:
    # The docker-compose stack end to end: Redpanda, Redis, processor, API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: |
          docker compose up -d --build api processor
          for i in $(seq 1 90); do
            curl -sf localhost:8000/healthz && exit 0
            sleep 2
          done
          docker compose ps -a
          exit 1
      - name: Replay traffic through API + Kafka
        run: docker compose run --rm --no-deps replay
      - name: Skew and drift report (fail on skew)
        run: >-
          docker compose run --rm --no-deps monitor monitor --raw=/data/raw --offline=/data/offline
          --model=/data/model --redis-url=redis://redis:6379/0 --fail-on-skew
      - name: Score one request
        run: |
          curl -sf 'localhost:8000/score?explain=true' -H 'content-type: application/json' -d '{
            "txn_id": "ci-1", "ts": 1777000000000, "card_id": "c00042", "merchant_id": "m0007",
            "amount": 1.25, "country": "IN", "channel": "online", "category": "digital_goods"}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
