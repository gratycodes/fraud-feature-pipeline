[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fraud-feature-pipeline"
version = "0.1.0"
description = "End-to-end fraud ML on synthetic card transactions: one feature definition for streaming (Kafka -> Redis) and point-in-time-correct offline backfill (DuckDB/Parquet), a calibrated LightGBM model, FastAPI serving, and train/serve skew + drift checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gratus Antin" }]
keywords = ["fraud-detection", "feature-store", "mlops", "point-in-time", "train-serve-skew", "lightgbm", "kafka", "redis", "duckdb"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "duckdb>=1.1",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "fakeredis>=2.23",  # in-process Redis for the no-Docker demo
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "confluent-kafka>=2.4",
]

[project.scripts]
ffp = "ffp.cli:main"

[project.urls]
Repository = "https://github.com/gratycodes/fraud-feature-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/ffp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real Redis (REDIS_URL) and/or Kafka (KAFKA_BOOTSTRAP)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.mypy]
python_version = "3.11"
files = ["src/ffp"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
